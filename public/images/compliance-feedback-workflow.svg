<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title description">
  <title id="title">SOC 2 and GDPR compliance feedback workflow</title>
  <desc id="description">Secureframe, Google Cloud Platform, and AWS Security Hub findings flow into a shared triage process. Findings are mapped to SOC 2 controls or GDPR processing activities, prioritized, assigned to an owner, remediated, verified with evidence, and reviewed for recurring causes. Improvements feed back into infrastructure and delivery checks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #172554; }
      .source { fill: #eff6ff; stroke: #60a5fa; }
      .work { fill: #f8fafc; stroke: #94a3b8; }
      .control { fill: #f0fdf4; stroke: #4ade80; }
      .feedback { fill: #fff7ed; stroke: #fb923c; }
      .box { stroke-width: 2; rx: 14; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font-size: 17px; font-weight: 650; text-anchor: middle; }
      .sub { font-size: 13px; fill: #475569; text-anchor: middle; }
      .lane { font-size: 13px; font-weight: 700; letter-spacing: .08em; fill: #64748b; }
    </style>
  </defs>

  <text class="lane" x="30" y="34">SIGNALS</text>
  <text class="lane" x="315" y="34">MAP AND REMEDIATE</text>
  <text class="lane" x="865" y="34">VERIFY AND IMPROVE</text>

  <rect class="box source" x="30" y="70" width="205" height="78"/>
  <text class="label" x="132" y="103">Secureframe</text>
  <text class="sub" x="132" y="127">audit and evidence feedback</text>

  <rect class="box source" x="30" y="190" width="205" height="78"/>
  <text class="label" x="132" y="223">Google Cloud</text>
  <text class="sub" x="132" y="247">posture and configuration</text>

  <rect class="box source" x="30" y="310" width="205" height="78"/>
  <text class="label" x="132" y="343">AWS Security Hub</text>
  <text class="sub" x="132" y="367">findings and security signals</text>

  <rect class="box work" x="310" y="190" width="205" height="100"/>
  <text class="label" x="412" y="226">Normalize and</text>
  <text class="label" x="412" y="249">group findings</text>
  <text class="sub" x="412" y="273">resource · risk · evidence gap</text>

  <rect class="box control" x="590" y="190" width="215" height="100"/>
  <text class="label" x="697" y="226">Map requirements</text>
  <text class="sub" x="697" y="252">SOC 2 controls</text>
  <text class="sub" x="697" y="273">GDPR processing activities</text>

  <rect class="box work" x="880" y="70" width="260" height="88"/>
  <text class="label" x="1010" y="105">Prioritize and assign</text>
  <text class="sub" x="1010" y="132">risk-based owner and due date</text>

  <rect class="box work" x="880" y="205" width="260" height="88"/>
  <text class="label" x="1010" y="240">Remediate and verify</text>
  <text class="sub" x="1010" y="267">attach evidence; review exceptions</text>

  <rect class="box feedback" x="590" y="365" width="550" height="82"/>
  <text class="label" x="865" y="399">Review recurring causes</text>
  <text class="sub" x="865" y="426">improve infrastructure defaults and delivery checks</text>

  <path class="edge" d="M235 109 C275 109 270 215 310 220"/>
  <path class="edge" d="M235 229 H310"/>
  <path class="edge" d="M235 349 C275 349 270 265 310 260"/>
  <path class="edge" d="M515 240 H590"/>
  <path class="edge" d="M805 215 C845 215 840 115 880 115"/>
  <path class="edge" d="M1010 158 V205"/>
  <path class="edge" d="M880 250 C835 250 850 406 810 406"/>
  <path class="edge" d="M590 406 C470 406 430 350 410 290"/>
  <text class="sub" x="470" y="383">new signals</text>
</svg>
